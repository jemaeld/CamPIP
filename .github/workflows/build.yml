name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Si existen los Secrets de firma se compila y publica el APK firmado (release).
      # Si no, solo se compila un APK debug como respaldo (no se publica Release).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar llave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado (release)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk tvcampip.apk

      - name: Compilar APK debug (sin Secrets de firma)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Faltan los Secrets de firma; se compila un APK debug y NO se publica Release."
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk tvcampip-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvcampip-apk
          path: |
            tvcampip.apk
            tvcampip-debug.apk
          if-no-files-found: error

      - name: Publicar Release (la app instalada lo detecta y ofrece actualizar)
        if: env.KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: TV Cam PiP build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: tvcampip.apk
          make_latest: true
